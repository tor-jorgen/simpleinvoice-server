services:
  postgres-server:
    image: postgres
    restart: no
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-simple_invoice}
      POSTGRES_USER: ${DB_USER:-db}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-db} -d ${DB_NAME:-simple_invoice}" ]
      interval: 1s
      timeout: 5s
      retries: 5

  server-init:
    image: alpine
    volumes:
      - documents:/documents
    command: chown -R 1000:1000 /documents
    depends_on:
      - postgres-server

  server:
    image: ghcr.io/tor-jorgen/simpleinvoice-server:1.1.0
    restart: no
    ports:
      - ${SERVER_PORT:-8080}:${SERVER_PORT:-8080}
    volumes:
      - ${LOCAL_CONFIG_DIRECTORY:-./.config}:/config
      - documents:/documents
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_CONNECTION_PRE: ${DB_CONNECTION_PRE:-jdbc:postgresql://postgres-server}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-simple_invoice}
      DB_USER: ${DB_USER:-db}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/migrations
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOW_HOSTS: ${ALLOW_HOSTS:-http://localhost:8000}
      SMTP_USER_NAME: ${SMTP_USER_NAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    depends_on:
      server-init:
        condition: service_completed_successfully
      postgres-server:
        condition: service_healthy

  app:
    image: ghcr.io/tor-jorgen/simpleinvoice-app:1.1.0
    restart: no
    ports:
      - ${APP_PORT:-8000}:${APP_PORT:-8000}
    depends_on:
      server:
        condition: service_completed_successfully

volumes:
  db-data:
    name: simple-invoice-db-data
  documents:
    name: simple-invoice-documents
