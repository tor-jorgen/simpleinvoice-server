name: Build pipeline

permissions:
  actions: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'example-requests/*'
      - 'example-templates/*'
      - 'http/*'
      - 'images/*'
      - '**/*.md'
      - '**/*.sh'
      - 'compose*.yaml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'example-requests/*'
      - 'example-templates/*'
      - 'http/*'
      - 'images/*'
      - '**/*.md'
      - '**/*.sh'
      - 'compose*.yaml'

env:
  IMAGE_NAME: ${{ github.repository }}
  DISTRIBUTION: temurin
  JAVA_VERSION: 25

jobs:
  lint-code:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Lint code with Super-Linter
        # super-linter v8.7.0
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_KOTLIN: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_YAML: true

  lint-workflow:
    name: Lint Github Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Actionlint
        # reviewdog/action-actionlint v.1.72.0
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d
        with:
          reporter: github-check
          github_token: ${{ secrets.GITHUB_TOKEN }}

  gradle-build-and-test:
    name: Gradle Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ lint-code, lint-workflow ]
    outputs:
      build-artifact-name: gradle-artifacts
      server-version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Java
        # actions/setup-java@5.5.0
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Run Gradle check
        run: ./gradlew check -x test
      # Archive the build directory (reports, classes, etc.)
      - name: Upload Gradle build artifacts
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gradle-artifacts
          path: build/
      - name: Get version
        id: get_version
        run: echo "VERSION=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

  sonar-analysis:
    name: SonarCloud Analysis
    needs: [ gradle-build-and-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up Java
        # actions/setup-java@5.5.0
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download Gradle build artifacts
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.gradle-build-and-test.outputs.build-artifact-name }}
          path: build/
      # Run Sonar analysis, skipping the build step to reuse existing artifacts
      - name: Run SonarCloud analysis
        run: ./gradlew sonar -x compileJava -x test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  scan-image:
    name: Scan image
    needs: [ sonar-analysis ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Log in to GHCR
        # docker/login-action v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
      - name: Scan image for vulnerabilities with Trivy
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: latest
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          # Må vente til repoet er public
          #          format: sarif
          #          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln,secret,misconfig
          exit-code: 1
      # Må vente til repoet er public
      #      - name: Upload Trivy scan results to GitHub Security tab
      #        if: always()
      #        uses: github/codeql-action/upload-sarif@v4
      #        with:
      #          sarif_file: trivy-results.sarif

  # Only run this job if the previous step succeeded AND the event was a push/merge to the main branch
  publish-image:
    name: Publish image
    needs: [ gradle-build-and-test, scan-image ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Log in to GHCR
        # docker/login-action v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest,ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }},ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.gradle-build-and-test.outputs.server-version }}

  # Only run this job if the previous step succeeded AND the event was a push/merge to the main branch
  create-release:
    name: Create GitHub Release
    needs: [ gradle-build-and-test, publish-image ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Set Release Tag
        id: tag_variable
        run: |
          VERSION="${{ needs.gradle-build-and-test.outputs.server-version }}"
          TAG_NAME="v$VERSION"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Create Release
        # softprops/action-gh-release v3.0.1
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_variable.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_variable.outputs.TAG_NAME }}
          body: See [RELEASE-NOTES.md](RELEASE-NOTES.md)
          draft: false
          prerelease: false
