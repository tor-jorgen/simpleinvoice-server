services:
  postgres-server:
    image: postgres
    restart: no
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-simple_invoice}
      POSTGRES_USER: ${DB_USER:-db}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    stop_grace_period: 30s

  s3-server:
    image: minio/minio
    restart: no
    ports:
      - ${S3_PORT:-9000}:9000
      - ${S3_ADM_PORT:-9001}:9001
    volumes:
      - s3-data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-doc}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    command: server /data --console-address ":${S3_ADM_PORT:-9001}"
    stop_grace_period: 30s

volumes:
  db-data:
    name: simple-invoice-db-data
  s3-data:
    name: simple-invoice-s3-data
